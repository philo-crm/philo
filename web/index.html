<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Deliberately not `viewport-fit=cover`: that hands the layout the notch
         and the home indicator to work around, and iOS insets the viewport by
         itself without it. -->
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Philo</title>
    <meta name="description" content="Self-hosted CRM" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Named separately from the manifest's `name`, so the Home Screen label
         stays short however the app is later described. -->
    <meta name="apple-mobile-web-app-title" content="Philo" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- Matches the surface behind the topbar in each scheme, so the status bar
         does not read as a second, differently coloured strip. -->
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1b2126" media="(prefers-color-scheme: dark)" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
